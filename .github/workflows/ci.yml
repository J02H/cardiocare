name: CardioCare CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure dataset exists (download or synthetic fallback)
        run: |
          python data/download_data.py

      - name: Train models (smoke test of full pipeline)
        env:
          PYTHONPATH: .
        run: |
          rm -rf mlruns mlflow.db
          python src/train.py --data data/heart.csv

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s tests -v

      - name: Run inference on sample input
        env:
          PYTHONPATH: .
        run: |
          python src/inference.py \
            --input data/sample_input.csv \
            --model models/final_model.joblib \
            --output outputs/predictions.csv

      - name: Run drift monitor
        env:
          PYTHONPATH: .
        run: |
          python src/monitor.py --data data/heart.csv --model models/final_model.joblib
